<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://kit.fontawesome.com/bf8b8f599c.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../../../style.css" />
    <title>CreateX - Landing</title>

    <style type="text/tailwindcss">
        @theme {
    --font-lato: Lato, sans-serif;
    --color-primary: #ff3f3a;
    --color-secondary: #f75e05;
    --color-primary-shadow: #ff3f3a80;
    --color-hero-bg: #f9dcd4;
    --color-primary-text: #1E212C;
    --color-secondary-text: #424551;
  }
    </style>
</head>

<body class="font-lato">
    <header class="p-4  top-0 w-full">
        <div class="container flex justify-between items-center">
            <a class="mr-12 pr-2" href="index.html"><img src="../../../images/logo/logo-dark.svg" width="130"
                    alt="logo" /></a>
            <nav class="self-start">
                <ul class="flex gap-2 justify-start mr-auto items-center self-start">
                    <li>
                        <a class="py-4 px-5 inline-block text-[#424551] font-bold" href="#">About us</a>
                    </li>

                    <li class="relative group">
                        <button type="button" class="py-4 px-5 inline-flex items-center text-[#424551] font-bold">
                            Courses
                            <i class="fa-solid fa-chevron-down text-xs ml-2"></i>
                        </button>
                        <ul
                            class="absolute left-0 top-full hidden group-hover:block bg-white shadow-lg rounded-md min-w-[180px] py-2">
                            <li><a class="block px-5 py-2 text-[#424551] hover:text-primary" href="#">Courses Grid</a>
                            </li>
                            <li><a class="block px-5 py-2 text-[#424551] hover:text-primary" href="#">Single Course</a>
                            </li>
                        </ul>
                    </li>

                    <li class="relative group">
                        <button type="button" class="py-4 px-5 inline-flex items-center text-[#424551] font-bold">
                            Events
                            <i class="fa-solid fa-chevron-down text-xs ml-2"></i>
                        </button>
                        <ul
                            class="absolute left-0 top-full hidden group-hover:block bg-white shadow-lg rounded-md min-w-[180px] py-2">
                            <li><a class="block px-5 py-2 text-[#424551] hover:text-primary" href="#">Events List</a>
                            </li>
                            <li><a class="block px-5 py-2 text-[#424551] hover:text-primary" href="#">Events Grid</a>
                            </li>
                            <li><a class="block px-5 py-2 text-[#424551] hover:text-primary" href="#">Events Single</a>
                            </li>
                        </ul>
                    </li>

                    <li class="relative group">
                        <button type="button" class="py-4 px-5 inline-flex items-center text-[#424551] font-bold">
                            Blog
                            <i class="fa-solid fa-chevron-down text-xs ml-2"></i>
                        </button>
                        <ul
                            class="absolute left-0 top-full hidden group-hover:block bg-white shadow-lg rounded-md min-w-[180px] py-2">
                            <li><a class="block px-5 py-2 text-[#424551] hover:text-primary" href="#">Blog Grid</a></li>
                            <li><a class="block px-5 py-2 text-[#424551] hover:text-primary" href="#">Single Post</a>
                            </li>
                        </ul>
                    </li>

                    <li>
                        <a class="py-4 px-5 inline-block text-[#424551] font-bold" href="#">Contacts</a>
                    </li>
                </ul>
            </nav>

            <div class="justify-self-end">
                <a href="#"
                    class="py-2.5 px-8 ml-6 bg-linear-to-r from-primary to-secondary text-white rounded-md font-bold">Get
                    consultation</a>
                <a href="#" class="text-primary font-bold ml-6"><i class="fa-regular fa-user mr-2"></i>Sign in/up</a>
            </div>

        </div>
    </header>

    <section class="mt-[100px]">
        <div class="master_section container">

            <div class="master_text">
                <h6 class="text-[16px] font-[700] text-primary-text text-center">Our events</h6>
                <h1 class="text-[46px] font-[900] text-primary-text text-center">Lectures, workshops & master-classes
                </h1>
            </div>

            <div class="flex flex-wrap items-center justify-between gap-4 mt-[48px] mb-[24px]">
                <div class="flex flex-wrap items-center gap-4">

                    <div class="flex items-center gap-2">
                        <span class="text-[14px] text-secondary-text">Event category</span>
                        <select class="text-[14px] text-primary-text border border-[#E4E5E8] rounded-[8px] px-3 py-2">
                            <option>All themes</option>
                            <option>Master-class</option>
                            <option>Lecture</option>
                            <option>Workshop</option>
                        </select>
                    </div>

                    <div class="flex items-center gap-2">
                        <span class="text-[14px] text-secondary-text">Sort by</span>
                        <select class="text-[14px] text-primary-text border border-[#E4E5E8] rounded-[8px] px-3 py-2">
                            <option>Newest</option>
                            <option>Oldest</option>
                        </select>
                    </div>

                    <div class="flex items-center gap-2">
                        <span class="text-[14px] text-secondary-text">Show</span>
                        <input type="number" value="9" min="1"
                            class="w-[56px] text-[14px] text-primary-text border border-[#E4E5E8] rounded-[8px] px-2 py-2 text-center " />
                        <span class="text-[14px] text-secondary-text">events per page</span>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <div class="relative">
                        <input type="text" placeholder="Search event..."
                            class="text-[14px] text-primary-text border border-[#E4E5E8] rounded-[8px] pl-4 pr-9 py-2 w-[220px] " />
                        <i
                            class="fa-solid fa-magnifying-glass text-secondary-text text-[14px] absolute right-3 top-1/2 -translate-y-1/2"></i>
                    </div>

                    <button type="button" class="w-9 h-9 flex items-center justify-center">
                        <i class="fa-solid fa-bars text-[14px]"></i>
                    </button>
                    <button type="button" class="w-9 h-9 flex items-center justify-center">
                        <i class="fa-solid fa-table-cells-large text-[14px]"></i>
                    </button>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
