<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Createx — Online Courses</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <style>
        body {
            font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
        }

        .modal-overlay {
            backdrop-filter: blur(2px);
        }
    </style>
    <style type="text/tailwindcss">
        @theme {
            --font-lato: Lato, sans-serif;
            --color-primary: #ff3f3a;
            --color-secondary: #f75e05;
            --color-primary-shadow: #ff3f3a80;
            --color-hero-bg: #f9dcd4;
            --color-primary-text: #1E212C;
            --color-secondary-text: #424551;
            --color-third-text: #787a80;
        }
    </style>
</head>

<body class="bg-[#FBF9F6]">
    <div id="signUpModal" class="fixed inset-0 z-50 flex items-center justify-center px-4">
        <div id="modalOverlay" class="modal-overlay absolute inset-0 bg-gray-900/60"></div>

        <div class="relative bg-white shadow-2xl w-full max-w-md p-8 sm:p-10">
            <button id="closeSignUp" class="absolute top-5 right-5 text-gray-400 hover:text-gray-700">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>

            <h2 class="text-[28px] font-[700] text-[#1E212C] text-center mb-2">Sign up</h2>
            <p class="text-[14px] font-[400] text-[#787A80] text-center mb-8 leading-relaxed max-w-[390px] mx-auto">
                Registration takes less than a minute but gives you full control over your studying.
            </p>

            <form id="signUpForm" class="space-y-5">
                 <div>
                    <label for="fullName" class="block text-[14px] font-[400] text-[#424551] mb-1.5">Full Name</label>
                    <input id="fullName" type="text" placeholder="Your full name"
                        class="w-full border border-[#D7DADD] rounded-[4px] px-4 py-2.5 text-[14px] text-gray-700 placeholder-gray-400" />
                </div>
                <div>
                    <label for="email" class="block text-[14px] font-[400] text-[#424551] mb-1.5">Email</label>
                    <input id="email" type="email" placeholder="Your working email"
                        class="w-full border border-[#D7DADD] rounded-[4px] px-4 py-2.5 text-[14px] text-gray-700 placeholder-gray-400" />
                </div>

                <div>
                    <label for="password" class="block text-[14px] font-[400] text-[#424551] mb-1.5">Password</label>
                    <div class="relative">
                        <input id="password" type="text" placeholder="Your password"
                            class="w-full border border-[#D7DADD] rounded-[4px] px-4 py-2.5 pr-10 text-[14px] text-gray-700 " />
                        <button type="button" id="togglePassword"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-[14px] font-[400] text-[#424551] mb-1.5">Confirm Password</label>
                    <div class="relative">
                        <input  type="password" placeholder="Confirm your password"`
                            class="w-full border border-[#D7DADD] rounded-[4px] px-4 py-2.5 pr-10 text-[14px] text-gray-700" />
                        <button type="button" id="toggleConfirmPassword"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <label class="flex items-center gap-2 text-sm text-gray-600 cursor-pointer">
                    <input type="checkbox" checked
                        class="w-4 h-4 rounded border-gray-300 text-red-500 focus:ring-red-400" />
                    Remember me
                </label>

                <button type="submit"
                    class="w-full bg-[#ff3f3a] to-orange-500 text-white font-semibold py-3 shadow-sm hover:bg-[#E63A35] hover:shadow-lg">
                    Sign up
                </button>

                <p class="text-sm text-gray-500">
                    Already have an account? <a href="#" class="text-red-500 font-semibold hover:underline">Sign in</a>
                </p>
            </form>

            <div class="flex items-center gap-3 my-6">
                <span class="flex-1 h-px bg-gray-200"></span>
                <span class="text-xs text-gray-400">Or sign in with</span>
                <span class="flex-1 h-px bg-gray-200"></span>
            </div>

            <div class="flex items-center justify-center gap-6">
                <a href="#" class="text-gray-400 hover:text-red-600"><svg class="w-[20px] h-[20px]" fill="currentColor"
                        viewBox="0 0 24 24">
                        <path
                            d="M22 12a10 10 0 10-11.5 9.87v-6.98H7.9V12h2.6V9.8c0-2.57 1.53-4 3.87-4 1.12 0 2.3.2 2.3.2v2.5h-1.3c-1.28 0-1.68.8-1.68 1.6V12h2.86l-.46 2.89h-2.4v6.98A10 10 0 0022 12z" />
                    </svg></a>
                <a href="#" class="text-gray-400 hover:text-red-600"><svg class="w-[20px] h-[20px]" fill="currentColor"
                        viewBox="0 0 24 24">
                        <path
                            d="M21.35 11.1h-9.17v2.92h5.27c-.23 1.4-1.62 4.1-5.27 4.1-3.17 0-5.76-2.62-5.76-5.85s2.59-5.85 5.76-5.85c1.8 0 3.01.77 3.7 1.43l2.52-2.43C16.9 3.7 14.87 2.7 12.18 2.7 6.94 2.7 2.7 6.94 2.7 12.18s4.24 9.48 9.48 9.48c5.47 0 9.1-3.84 9.1-9.25 0-.62-.07-1.1-.13-1.31z" />
                    </svg></a>
                <a href="#" class="text-gray-400 hover:text-red-600"><svg class="w-[20px] h-[20px]" fill="currentColor"
                        viewBox="0 0 24 24">
                        <path
                            d="M22 5.9c-.77.34-1.6.57-2.46.68a4.3 4.3 0 001.88-2.38 8.6 8.6 0 01-2.72 1.04 4.28 4.28 0 00-7.29 3.9A12.14 12.14 0 013 4.9a4.28 4.28 0 001.33 5.71 4.24 4.24 0 01-1.94-.54v.05a4.28 4.28 0 003.43 4.2 4.3 4.3 0 01-1.93.07 4.28 4.28 0 004 2.97A8.58 8.58 0 012 18.57 12.1 12.1 0 008.29 20.5c7.55 0 11.68-6.26 11.68-11.68 0-.18 0-.36-.01-.53A8.35 8.35 0 0022 5.9z" />
                    </svg></a>
                <a href="#" class="text-gray-400 hover:text-red-600"><svg class="w-[20px] h-[20px]" fill="currentColor"
                        viewBox="0 0 24 24">
                        <path
                            d="M4.98 3.5a2.5 2.5 0 11.02 5 2.5 2.5 0 01-.02-5zM3 8.98h4v12H3v-12zm7 0h3.83v1.64h.05c.53-1 1.83-2.06 3.77-2.06 4.04 0 4.78 2.66 4.78 6.12v6.3h-4v-5.59c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.69h-4v-12z" />
                    </svg></a>
            </div>
        </div>
    </div>
    <script src="../../../i18n.js"></script>
</body>
</html>
